[project]
name = "ctlab"
version = "0.1.0"
description = "Research lab for cTrader strategies: data, backtest, walk-forward optimization."
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "ctrader-open-api>=0.9.2",
    "service-identity>=24.2.0",
    "optuna>=5.0.0",
]

[project.scripts]
ctlab = "ctlab.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google.protobuf.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query"]
