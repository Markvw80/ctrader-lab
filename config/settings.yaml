# Global defaults. Values here are overridable per run via CLI flags.
data:
  base_timeframe: M1      # higher timeframes are resampled from M1
  store_ticks: false      # ticks optional, partitioned per month

account:
  currency: USD
  initial_balance: 10000
  risk_per_trade_pct: 0.5
  daily_loss_limit_pct: 2.0
  max_leverage: 20         # notional cap = equity * max_leverage
  # Trading day starts at the New York 17:00 rollover (21:00/22:00 UTC, DST-aware).
  day_start: {tz: "America/New_York", time: "17:00"}

backtest:
  exec_timeframe: M1      # SL/TP/fills are simulated on this timeframe
  spread_stat: median     # median | p90 (stress test with wider spreads)

optimization:
  objective: sharpe            # sharpe | return_dd | net_profit | profit_factor
  holdout_pct: 20              # only used the FIRST time; the start date is then fixed on disk
  wf_in_sample_months: 12
  wf_out_of_sample_months: 3
  wf_anchored: false           # true = in-sample always starts at the beginning
  warmup_days: 10              # history loaded before a window for indicators (no trades)
  min_trades_per_window: 30    # in-sample: trials with fewer trades are rejected
  min_trades_oos: 10           # out-of-sample: fewer trades -> window counts as inconclusive
  not_robust_oos_is_ratio: 0.5 # OOS annual return < 50% of IS -> not robust
  min_profitable_oos_windows_pct: 50
  sensitivity_min_stability: 0.5   # median neighbour objective / best objective
  seed: 42
